AWSTemplateFormatVersion: "2010-09-09"
Description: Kohort S3 Sanitizer - Lambda scrubber for S3 Batch Operations

Parameters:
  NamePrefix:
    Type: String
    Default: kohort-s3-sanitizer

  SourceBucketName:
    Type: String
    Description: S3 bucket containing raw objects.

  SourcePrefix:
    Type: String
    Default: ""
    Description: Source prefix for IAM and key mapping (e.g. raw/).

  DestBucketName:
    Type: String
    Description: S3 bucket for sanitized output.

  CreateDestBucket:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  DestPrefix:
    Type: String
    Default: ""

  RulesetBucketName:
    Type: String
    Description: S3 bucket containing the ruleset file.

  RulesetObjectKey:
    Type: String
    Description: S3 object key for the ruleset (e.g. config/ruleset.yaml).

  LambdaImageUri:
    Type: String
    Description: ECR image URI for the scrubber Lambda.

  LambdaMemoryMb:
    Type: Number
    Default: 1024

  LambdaTimeoutSeconds:
    Type: Number
    Default: 60

  ReservedConcurrentExecutions:
    Type: Number
    Default: -1
    Description: Set -1 to omit reserved concurrency.

  KmsKeyArn:
    Type: String
    Default: ""

  LogRetentionDays:
    Type: Number
    Default: 30

  ManifestsPrefix:
    Type: String
    Default: ops/manifests/
    Description: Prefix in the config bucket for Batch manifest CSV files.

  BatchReportsPrefix:
    Type: String
    Default: ops/batch-reports/
    Description: Prefix in the config bucket for Batch completion reports.

  InventoryPrefix:
    Type: String
    Default: ops/inventory/
    Description: Optional inventory report prefix (Batch role read access only).

Conditions:
  CreateDestBucket: !Equals [!Ref CreateDestBucket, "true"]
  UseKms: !Not [!Equals [!Ref KmsKeyArn, ""]]
  UseReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrentExecutions, -1]]

Resources:
  DestBucket:
    Type: AWS::S3::Bucket
    Condition: CreateDestBucket
    Properties:
      BucketName: !Ref DestBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [UseKms, aws:kms, AES256]
              KMSMasterKeyID: !If [UseKms, !Ref KmsKeyArn, !Ref AWS::NoValue]
            BucketKeyEnabled: !If [UseKms, true, false]

  ScrubberLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${NamePrefix}-scrubber
      RetentionInDays: !Ref LogRetentionDays

  ScrubberRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-scrubber
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: scrubber-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${SourceBucketName}
                  - !Sub arn:aws:s3:::${SourceBucketName}/${SourcePrefix}*
              - Sid: WriteDest
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::${DestBucketName}/${DestPrefix}*
              - Sid: ReadRuleset
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${RulesetBucketName}/${RulesetObjectKey}
              - !If
                - UseKms
                - Sid: Kms
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:Encrypt
                    - kms:GenerateDataKey
                  Resource: !Ref KmsKeyArn
                - !Ref AWS::NoValue

  ScrubberFunction:
    Type: AWS::Lambda::Function
    DependsOn: ScrubberLogGroup
    Properties:
      FunctionName: !Sub ${NamePrefix}-scrubber
      PackageType: Image
      Code:
        ImageUri: !Ref LambdaImageUri
      Role: !GetAtt ScrubberRole.Arn
      MemorySize: !Ref LambdaMemoryMb
      Timeout: !Ref LambdaTimeoutSeconds
      ReservedConcurrentExecutions: !If
        - UseReservedConcurrency
        - !Ref ReservedConcurrentExecutions
        - !Ref AWS::NoValue
      Environment:
        Variables:
          DEST_BUCKET: !Ref DestBucketName
          DEST_PREFIX: !Ref DestPrefix
          SOURCE_PREFIX: !Ref SourcePrefix
          RULESET_URI: !Sub s3://${RulesetBucketName}/${RulesetObjectKey}

  ScrubberInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScrubberFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  BatchInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${NamePrefix}-batch-invoke
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt ScrubberFunction.Arn

  BatchOperationsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-batch-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batchoperations.s3.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BatchInvokePolicy
      Policies:
        - PolicyName: batch-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadManifests
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${RulesetBucketName}/${ManifestsPrefix}*
                  - !Sub arn:aws:s3:::${RulesetBucketName}/${InventoryPrefix}*
              - Sid: WriteReports
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::${RulesetBucketName}/${BatchReportsPrefix}*

Outputs:
  LambdaFunctionName:
    Value: !Ref ScrubberFunction
  LambdaFunctionArn:
    Value: !GetAtt ScrubberFunction.Arn
  LambdaRoleArn:
    Value: !GetAtt ScrubberRole.Arn
  DestBucketName:
    Value: !Ref DestBucketName
  BatchOperationsPolicyArn:
    Value: !Ref BatchInvokePolicy
  BatchOperationsRoleArn:
    Value: !GetAtt BatchOperationsRole.Arn
  BatchOperationsRoleName:
    Value: !Ref BatchOperationsRole
  RulesetUri:
    Value: !Sub s3://${RulesetBucketName}/${RulesetObjectKey}
